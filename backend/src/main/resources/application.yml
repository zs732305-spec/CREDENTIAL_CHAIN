server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/credentials}
    username: ${DB_USER:app}
    password: ${DB_PASS:app}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
app:
  jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
  jwt-hours: ${JWT_HOURS:12}
  master-key: ${MASTER_KEY:dev-master-key-change-me}
  admin-email: ${ADMIN_EMAIL:admin@example.com}
  admin-password: ${ADMIN_PASSWORD:change-me-now}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  fund-amount: ${FUND_AMOUNT:0.1}
  pinata-jwt: ${PINATA_JWT:}
chain:
  rpc: ${CHAIN_RPC_URL:}
  admin-key: ${ADMIN_PRIVATE_KEY:}
  contract: ${CONTRACT_ADDRESS:}
  id: ${CHAIN_ID:80002}
